[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thieponline-guests-mcp"
version = "0.1.0"
description = "MCP server để AI agent quản lý khách mời trên thieponline.app (Supabase)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ngoctp27" }]
keywords = ["mcp", "thieponline", "wedding", "guests", "supabase"]
dependencies = [
    "fastmcp>=4.0",
]

[project.urls]
Homepage = "https://ngoctp27.github.io/thieponline-app-mcp/"
Repository = "https://github.com/ngoctp27/thieponline-app-mcp"

[project.scripts]
thieponline-guests-mcp = "thieponline_guests_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thieponline_guests_mcp"]
